<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#022c22" flood-opacity="0.4"/>
    </filter>
  </defs>
  
  <!-- Outer Rounded Shield -->
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  
  <!-- Outer Gold Radar Ring -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="url(#ring)" stroke-width="14" stroke-dasharray="16 12" opacity="0.85"/>
  <circle cx="256" cy="256" r="160" fill="#ffffff" fill-opacity="0.12"/>
  
  <!-- Center Paw Print (Mascotas Go Icon) -->
  <g filter="url(#shadow)" fill="#ffffff">
    <!-- Main Paw Pad -->
    <path d="M256 250 C210 250 170 285 180 340 C190 380 220 400 256 400 C292 400 322 380 332 340 C342 285 302 250 256 250 Z"/>
    
    <!-- Toe 1 -->
    <ellipse cx="160" cy="225" rx="32" ry="44" transform="rotate(-20 160 225)"/>
    <!-- Toe 2 -->
    <ellipse cx="222" cy="180" rx="30" ry="46" transform="rotate(-6 222 180)"/>
    <!-- Toe 3 -->
    <ellipse cx="290" cy="180" rx="30" ry="46" transform="rotate(6 290 180)"/>
    <!-- Toe 4 -->
    <ellipse cx="352" cy="225" rx="32" ry="44" transform="rotate(20 352 225)"/>
  </g>
  
  <!-- Cute Camera Lens Center Accent -->
  <circle cx="256" cy="335" r="22" fill="#059669"/>
  <circle cx="256" cy="335" r="12" fill="#34d399"/>
  <circle cx="260" cy="331" r="4" fill="#ffffff"/>
</svg>
